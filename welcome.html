<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to PageCub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      line-height: 1.5;
      min-height: 100vh;
      font-size: 16px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 40px;
    }

    /* Header Section */
    .header {
      text-align: center;
      margin-bottom: 80px;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 32px;
      display: block;
    }

    .main-title {
      font-size: 36px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .subtitle {
      font-size: 18px;
      color: #666666;
      font-weight: 400;
    }

    /* Features Section */
    .features-section {
      margin-bottom: 80px;
    }

    .feature-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      margin-bottom: 60px;
      align-items: center;
    }

    .feature-row:last-child {
      margin-bottom: 0;
    }

    .feature-image-wrapper {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .feature-image {
      width: 100%;
      height: auto;
      display: block;
    }

    .feature-text {
      padding: 20px;
    }

    .feature-title {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .feature-description {
      font-size: 18px;
      color: #666666;
      line-height: 1.6;
    }

    /* Platforms Section */
    .platforms-section {
      background: linear-gradient(135deg, #E3F2FD 0%, #BBDEFB 100%);
      border-radius: 24px;
      padding: 80px 60px;
      text-align: center;
    }

    .platforms-title {
      font-size: 32px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 24px;
      line-height: 1.2;
    }

    .platforms-description {
      font-size: 18px;
      color: #4a4a4a;
      line-height: 1.7;
      margin-bottom: 48px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .platforms-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
      flex-wrap: wrap;
    }

    .platform-link {
      display: inline-block;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .platform-link:hover {
      transform: scale(1.1);
    }

    .platform-icon {
      width: 64px;
      height: 64px;
      display: block;
    }

    /* Responsive Design */
    @media (max-width: 1024px) {
      .feature-row {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .feature-text {
        text-align: center;
      }
    }

    @media (max-width: 768px) {
      .container {
        padding: 40px 20px;
      }

      .header {
        margin-bottom: 60px;
      }

      .main-title {
        font-size: 28px;
      }

      .subtitle {
        font-size: 16px;
      }

      .feature-title {
        font-size: 24px;
      }

      .feature-description {
        font-size: 16px;
      }

      .platforms-section {
        padding: 60px 30px;
      }

      .platforms-title {
        font-size: 26px;
      }

      .platforms-description {
        font-size: 16px;
      }

      .platform-icon {
        width: 56px;
        height: 56px;
      }

      .platforms-icons {
        gap: 24px;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 32px 16px;
      }

      .logo {
        width: 64px;
        height: 64px;
      }

      .main-title {
        font-size: 24px;
      }

      .platforms-section {
        padding: 40px 20px;
      }

      .platform-icon {
        width: 48px;
        height: 48px;
      }

      .platforms-icons {
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header Section -->
    <div class="header">
      <img src="icons/pagecub-logo.png" alt="ThreadCub Logo" class="logo">
      <h1 class="main-title">PageCub is installed!</h1>
      <p class="subtitle">Tiny paws, mighty exports</p>
    </div>

    <!-- Features Section -->
    <div class="features-section">
      <!-- Feature 1: Continue Conversations -->
      <div class="feature-row">
        <div class="feature-image-wrapper">
          <img src="assets/images/Continue-convo.png" alt="Continue conversations across AI platforms" class="feature-image">
        </div>
        <div class="feature-text">
          <h2 class="feature-title">Save Articles for Offline Reading</h2>
          <p class="feature-description">
           Transform any Substack post into a clean, professionally formatted PDF. No clutter, no ads—just the content you want.
          </p>
          <p>Need plain text? Download as Markdown to edit, archive, or integrate with your favorite tools.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
